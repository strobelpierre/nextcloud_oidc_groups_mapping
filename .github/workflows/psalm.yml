name: Psalm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  psalm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ocp: ['dev-stable29', 'dev-stable35']
    name: Psalm static analysis (OCP ${{ matrix.ocp }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer require --dev --no-interaction --prefer-dist -W "nextcloud/ocp:${{ matrix.ocp }}"

      - name: Run Psalm
        run: composer psalm
